# Hạ tầng dev cho gem-inventory. Chạy: `docker compose up -d`
# Postgres: DATABASE_URL=postgres://postgres:dev@localhost:5432/gem_inventory
# MinIO (S3-compatible, lưu ảnh): API http://localhost:9000, console http://localhost:9001 (minioadmin/minioadmin)
services:
  postgres:
    image: postgres:16
    container_name: gem-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gem_inventory
    ports:
      - "5432:5432"
    volumes:
      - gem-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gem_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: gem-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gem-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tạo bucket + cho phép đọc công khai (ảnh không nhạy cảm; giá nằm ở DB)
  createbucket:
    image: minio/mc
    container_name: gem-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb -p local/gem-inventory-photos &&
      mc anonymous set download local/gem-inventory-photos &&
      echo 'bucket gem-inventory-photos ready'
      "
    restart: "no"

volumes:
  gem-pg-data:
  gem-minio-data:
