# Hạ tầng dev cho gem-inventory. Chạy: `docker compose up -d`
# Postgres: DATABASE_URL=postgres://postgres:dev@localhost:5432/gem_inventory
# MinIO (S3-compatible, lưu ảnh): API http://localhost:9000, console http://localhost:9001 (minioadmin/minioadmin)
#
# GHI CHÚ IMAGE MinIO:
#   - Image chính thức `minio/minio` đã ngừng phát hành (10/2025) → dùng image Bitnami.
#   - `bitnamicharts/minio` là HELM CHART (không chạy bằng docker/compose) — KHÔNG dùng ở đây.
#   - Mặc định dưới đây là `bitnamilegacy/minio` (bản free, backup, không update — kéo được không cần login).
#     Thay bằng `bitnami/minio:2025.4.22` (pin tag) nếu bạn có quyền kéo bản current.
#   - Bitnami tự chạy server, KHÔNG cần `command:`; tự tạo bucket qua MINIO_DEFAULT_BUCKETS; data ở /bitnami/minio/data.
services:
  postgres:
    image: postgres:16
    container_name: gem-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gem_inventory
    ports:
      - "5432:5432"
    volumes:
      - gem-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gem_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    container_name: gem-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Tự tạo bucket + cho đọc công khai (ảnh không nhạy cảm; giá nằm ở DB)
      MINIO_DEFAULT_BUCKETS: "gem-inventory-photos:download"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gem-minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  gem-pg-data:
  gem-minio-data:
