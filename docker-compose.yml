# Hạ tầng dev cho gem-inventory. Chạy: `docker compose up -d`
# Backend đọc DATABASE_URL=postgres://postgres:dev@localhost:5432/gem_inventory
services:
  postgres:
    image: postgres:16
    container_name: gem-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gem_inventory
    ports:
      - "5432:5432"
    volumes:
      - gem-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gem_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gem-pg-data:
